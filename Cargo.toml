[package]
name = "codex-accounts"
version = "0.1.0"
edition = "2021"
description = "CLI for viewing Codex account usage and switching accounts"
license = "MIT"
repository = "https://github.com/sieciowiecxyz/codex-accounts"
readme = "README.md"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
dirs = "6.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
tungstenite = "0.24"
